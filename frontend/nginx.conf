# ---------------------------------------------------------------------------
# My-Money — nginx configuration.
#
# One origin serves everything: the built SPA, the API, the Django admin, and
# Django's static files. That is deliberate and it is what the application was
# built for — in development Vite proxies /api to Django for exactly this
# reason, so the CORS and CSRF behaviour here is identical to what was tested
# locally rather than a second, untested configuration.
#
# Request routing:
#   /api/*     -> Django (gunicorn)
#   /admin/*   -> Django
#   /static/*  -> collected Django static files, from the shared data volume
#   /media/*   -> user uploads, from the shared data volume
#   /*         -> the SPA, with history fallback
# ---------------------------------------------------------------------------

# Docker's embedded DNS. Resolving at request time rather than at startup means
# nginx survives the API container being restarted and getting a new address —
# with a static upstream name nginx resolves once at boot and then caches a
# stale IP, or refuses to start at all if the API is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:8000;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Persian content throughout. Without an explicit charset nginx omits it
    # from the Content-Type header and some browsers fall back to a legacy
    # encoding, which turns the whole interface into mojibake.
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json;

    root /usr/share/nginx/html;
    index index.html;

    # Room for a future upload feature. Django enforces its own limits; this is
    # the outer bound, so a large body is rejected at the edge rather than
    # buffered in full by the application.
    client_max_body_size 20m;

    # Don't advertise the exact nginx version in error pages.
    server_tokens off;

    # --- Compression ------------------------------------------------------
    # Text only. Images and fonts are already compressed, and re-compressing
    # them costs CPU for nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- Liveness for the container healthcheck ---------------------------
    # Answered by nginx itself: no disk access, no upstream call, so it reports
    # on this container only.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;

        # Forward the original Host so Django's ALLOWED_HOSTS sees the name the
        # user actually typed rather than the internal service name.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Reports can aggregate several months of transactions, so allow more
        # than the 60s default before giving up.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Let Django's own redirects through unchanged.
        proxy_redirect off;
    }

    # --- Django admin ------------------------------------------------------
    location /admin/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Django static files ----------------------------------------------
    # Served straight off the shared data volume. Django never sees these
    # requests, which is the whole reason STATIC_ROOT lives outside the image.
    location /static/ {
        alias /data/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        # A missing static file is a deployment problem, not a 404 to hide.
        try_files $uri =404;
    }

    # --- User uploads ------------------------------------------------------
    # Nothing uploads a file yet; the location exists so that when something
    # does, it works without a config change. Not cached aggressively, because
    # a replaced file keeps its name.
    location /media/ {
        alias /data/media/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- SPA ---------------------------------------------------------------
    # Every unknown path is a client-side route, so it must return index.html
    # rather than a 404. This is what makes a hard refresh on /budgets work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it is the file that references the
    # hashed bundles, so a cached copy pins the user to the previous deploy
    # until they hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Vite writes content-hashed filenames, so these are safe to cache forever:
    # any change produces a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}
